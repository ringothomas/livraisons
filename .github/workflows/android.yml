name: Appli Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes, notification et permissions
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/. android/app/src/main/res/
          # Écran de démarrage aux couleurs de l'appli
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Livraisons<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Livraisons<\/string>/' android/app/src/main/res/values/strings.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Waze et le téléphone doivent pouvoir s'ouvrir depuis l'appli
          sed -i 's#<application#<queries>\n        <package android:name="com.waze" />\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n        <intent><action android:name="android.intent.action.DIAL" /></intent>\n    </queries>\n\n    <application#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Synchroniser
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Livraisons.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Appli Android livreurs (version ${{ github.run_number }})
          body: |
            Appli Android des livreurs Appro Frites.
            Sur le téléphone : télécharger **Livraisons.apk**, l'ouvrir et autoriser l'installation.
          files: Livraisons.apk
          make_latest: true
