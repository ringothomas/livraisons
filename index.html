<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5770">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Livraisons Appro Frites</title>
<style>
  :root{
    --bg:#eef1f2; --surface:#fff; --surface-2:#e4e9eb; --ink:#17222b; --muted:#55636b;
    --line:#d8dfe2; --marine:#2c5770; --marine-soft:#dce9ef; --accent:#c97a2e; --accent-soft:#f4e1cc;
    --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#c9542f; --warn-soft:#fbe3d9; --danger:#b23a2e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12181d; --surface:#1a2229; --surface-2:#212b33; --ink:#eef2f4; --muted:#9aa8af;
      --line:#2c383f; --marine:#7fb0c9; --marine-soft:#1d323d; --accent:#e08f3f; --accent-soft:#3a2b18;
      --ok:#6cbf8e; --ok-soft:#173427; --warn:#e2865f; --warn-soft:#3a2419; --danger:#e2776a; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px;}
  header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;}
  header h1{font-size:1.1rem;margin:0;}
  .pill{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--muted);background:var(--surface);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .dot.on{background:var(--ok);} .dot.off{background:var(--danger);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px;}
  input,select{font:inherit;font-size:1.1rem;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
  button{font:inherit;cursor:pointer;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:12px;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;background:var(--marine);text-decoration:none;}
  .btn:disabled{opacity:.5;}
  .btn.ok{background:var(--ok);font-size:1.3rem;padding:20px;}
  .btn.waze{background:#33ccff;color:#06283d;}
  .btn.light{background:var(--surface-2);color:var(--ink);font-weight:600;}
  .row{display:flex;gap:10px;} .row > *{flex:1;}
  .progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:4px 0 12px;}
  .progress > div{height:100%;background:var(--ok);}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .small{font-size:.85rem;}
  .stop-num{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:var(--marine);color:#fff;font-weight:700;margin-right:6px;}
  .cur h2{font-size:1.5rem;margin:6px 0 2px;}
  .big{font-size:1.6rem;font-weight:800;margin:10px 0;}
  .tag{display:inline-block;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;margin:2px 4px 2px 0;}
  .tag.h{background:var(--warn-soft);color:var(--warn);}
  .tag.t{background:var(--marine-soft);color:var(--marine);}
  .comment{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:600;}
  .banner{background:var(--warn-soft);border:2px solid var(--warn);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:600;}
  .banner.arr{background:var(--ok-soft);border-color:var(--ok);}
  ul.list{list-style:none;margin:0;padding:0;}
  ul.list li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line);}
  ul.list li:first-child{border-top:none;}
  ul.list li .info{flex:1;min-width:0;}
  ul.list li.done{opacity:.6;}
  .linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;color:var(--marine);font-weight:600;}
  .err{color:var(--danger);font-weight:600;margin-top:10px;}
  details summary{cursor:pointer;font-weight:700;padding:4px 0;}
  .hidden{display:none!important;}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:10;max-width:90vw;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚚 Livraisons <span id="h-camion" class="muted"></span></h1>
    <span class="pill"><span class="dot" id="gps-dot"></span><span id="gps-txt">GPS</span></span>
  </header>

  <!-- Connexion -->
  <section id="v-login" class="card hidden">
    <div style="font-weight:700;font-size:1.2rem;">Connexion livreur</div>
    <label for="l-camion">Camion</label>
    <select id="l-camion"><option>Camion 1</option><option>Camion 2</option></select>
    <label for="l-code">Code (6 chiffres)</label>
    <input id="l-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••">
    <div style="height:14px"></div>
    <button class="btn" id="l-go">Se connecter</button>
    <div class="err" id="l-err"></div>
  </section>

  <!-- Tournée -->
  <section id="v-tour" class="hidden">
    <div class="small muted" id="t-date"></div>
    <div class="row small" style="align-items:center;">
      <div id="t-count" class="num" style="flex:3;font-weight:700;"></div>
      <select id="t-select" class="hidden" style="flex:2;font-size:.9rem;padding:6px;"></select>
    </div>
    <div class="progress"><div id="t-bar" style="width:0"></div></div>
    <div id="t-banner"></div>
    <div id="t-current"></div>
    <div class="card">
      <details open>
        <summary id="t-rest-title">Reste à livrer</summary>
        <ul class="list" id="t-rest"></ul>
      </details>
    </div>
    <div class="card">
      <details>
        <summary id="t-done-title">Déjà livrés</summary>
        <ul class="list" id="t-done"></ul>
      </details>
    </div>
    <div class="row">
      <button class="btn light" id="b-refresh">↻ Actualiser</button>
      <button class="btn light" id="b-logout">Changer de camion</button>
    </div>
    <p class="small muted" style="margin-top:14px;">Garde l'appli à l'écran pendant la tournée (téléphone sur support) : c'est ce qui permet de suivre le camion et de reconnaître le client où tu t'arrêtes.</p>
  </section>

  <div id="v-msg" class="card hidden"></div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
"use strict";
const API = "https://sxiewmxfeqssiwfcvmxk.supabase.co/functions/v1/livraison";
const RAYON_ARRIVEE_M = 120;      // à moins de 120 m d'un client : on considère qu'il y est
const ENVOI_POS_MS = 30000;       // position envoyée au plus toutes les 30 s

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};

let auth = store.get("af_auth", null);          // {camion, code}
let data = null;                                 // {date, tournees, statuts}
let tid = store.get("af_tid", null);             // tournée choisie
let faits = new Map();                           // line_id -> fait_le
let pos = null;                                  // {lat,lng,acc,t}
let lastSent = 0;
let courant = store.get("af_courant", null);     // line_id de l'arrêt affiché
let horsOrdre = false;                           // le livreur a pris un arrêt hors ordre
let file = store.get("af_file", []);             // actions en attente (hors réseau)
let arriveeVue = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add("hidden"), 2600); }
function vibre(){ try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(_){} }

async function api(body){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  let j = null; try{ j = await r.json(); }catch(_){}
  if(!r.ok || !j || !j.ok){ const e = new Error((j && j.erreur) || ("erreur "+r.status)); e.status = r.status; throw e; }
  return j;
}

function km(a,b){
  const R=6371, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function distTxt(d){ return d < 1 ? Math.round(d*1000)+" m" : d.toFixed(d<10?1:0).replace(".",",")+" km"; }

function tournee(){ return data && data.tournees.find(t=>t.id===tid) || null; }
function arrets(){ const t=tournee(); return t ? (t.arrets||[]) : []; }
function restants(){ return arrets().filter(a=>!faits.has(a.line_id)); }

/* ---------- Connexion ---------- */
function showLogin(err){
  $("v-login").classList.remove("hidden"); $("v-tour").classList.add("hidden"); $("v-msg").classList.add("hidden");
  $("h-camion").textContent = "";
  $("l-err").textContent = err || "";
  if(auth) $("l-camion").value = auth.camion;
}
$("l-go").addEventListener("click", async ()=>{
  const camion = $("l-camion").value, code = $("l-code").value.trim();
  $("l-err").textContent = "";
  $("l-go").disabled = true;
  try{
    auth = { camion, code };
    await charger(true);
    store.set("af_auth", auth);
  }catch(e){
    auth = null;
    $("l-err").textContent = e.status===401 ? "Code incorrect." : "Connexion impossible (réseau ?). Réessaie.";
  }finally{ $("l-go").disabled = false; }
});
$("b-logout").addEventListener("click", ()=>{ store.del("af_auth"); store.del("af_tid"); store.del("af_courant"); auth=null; data=null; showLogin(); });
$("b-refresh").addEventListener("click", ()=> charger(false).then(()=>toast("Tournée à jour")).catch(()=>toast("Pas de réseau")));

async function charger(premier){
  const j = await api({ action:"connexion", camion: auth.camion, code: auth.code });
  data = j;
  faits = new Map((j.statuts||[]).map(s=>[s.line_id, s.fait_le]));
  // actions en attente encore non envoyées : elles comptent déjà
  file.forEach(a=>{ if(a.action==="livre") faits.set(a.line_id, a.t); if(a.action==="annuler") faits.delete(a.line_id); });
  if(!j.tournees.some(t=>t.id===tid)) tid = j.tournees.length ? j.tournees[0].id : null;
  store.set("af_tid", tid);
  $("v-login").classList.add("hidden");
  $("h-camion").textContent = "· " + auth.camion;
  if(!j.tournees.length){
    $("v-tour").classList.add("hidden");
    $("v-msg").classList.remove("hidden");
    $("v-msg").innerHTML = `<div style="font-weight:700;font-size:1.15rem;">Pas de tournée aujourd'hui</div>
      <p class="muted">Aucune tournée n'a été envoyée pour le ${esc(dateFr(j.date))} pour ${esc(auth.camion)}. Si tu dois livrer, demande au bureau de cliquer sur « 📲 Envoyer aux livreurs ».</p>
      <button class="btn light" id="b-retry">↻ Réessayer</button> <div style="height:8px"></div><button class="btn light" id="b-out2">Changer de camion</button>`;
    $("b-retry").onclick = ()=> charger(false).catch(()=>toast("Pas de réseau"));
    $("b-out2").onclick = ()=> $("b-logout").click();
    return;
  }
  $("v-msg").classList.add("hidden");
  $("v-tour").classList.remove("hidden");
  if(premier){ courant = null; }
  rendre();
  demarrerGPS();
  garderEcran();
}
function dateFr(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }catch(_){ return d; } }

/* ---------- Choix de l'arrêt affiché ---------- */
function prochainDansOrdre(){ return restants()[0] || null; }
function plusProche(){
  const r = restants(); if(!r.length) return null;
  if(!pos) return r[0];
  return r.slice().sort((a,b)=>km(pos,a)-km(pos,b))[0];
}
function arretCourant(){
  const r = restants();
  if(courant && r.some(a=>a.line_id===courant)) return r.find(a=>a.line_id===courant);
  const a = horsOrdre ? plusProche() : prochainDansOrdre();
  courant = a ? a.line_id : null;
  store.set("af_courant", courant);
  return a;
}
function choisir(lineId, raison){
  courant = lineId; store.set("af_courant", courant);
  const p = prochainDansOrdre();
  horsOrdre = !!(p && p.line_id !== lineId);
  if(raison) toast(raison);
  rendre();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- Affichage ---------- */
function wazeUrl(a){ return `https://waze.com/ul?ll=${a.lat},${a.lng}&navigate=yes`; }
function rendre(){
  const t = tournee(); if(!t) return;
  const tous = arrets(), r = restants(), nbFaits = tous.length - r.length;
  $("t-date").textContent = `Livraison du ${dateFr(t.date_livraison)} · départ prévu ${t.depart||"–"}`;
  $("t-count").textContent = `${nbFaits} / ${tous.length} livrés`;
  $("t-bar").style.width = (tous.length ? Math.round(nbFaits*100/tous.length) : 0) + "%";
  const sel = $("t-select");
  if(data.tournees.length > 1){
    sel.classList.remove("hidden");
    sel.innerHTML = data.tournees.map(x=>`<option value="${esc(x.id)}" ${x.id===tid?"selected":""}>Véhicule ${String.fromCharCode(65+(x.vehicule||0))} (${(x.arrets||[]).length} arrêts)</option>`).join("");
    sel.onchange = ()=>{ tid = sel.value; store.set("af_tid", tid); courant=null; horsOrdre=false; rendre(); };
  } else sel.classList.add("hidden");

  const a = arretCourant();
  const ban = $("t-banner"); ban.innerHTML = "";
  if(!a){
    $("t-current").innerHTML = `<div class="card" style="text-align:center;"><div style="font-size:2.4rem;">🎉</div><div class="big">Tournée terminée</div><div class="muted">Toutes les livraisons sont validées. Retour au dépôt !</div></div>`;
  } else {
    const prevu = prochainDansOrdre();
    const ici = pos && km(pos, a)*1000 <= RAYON_ARRIVEE_M;
    if(ici) ban.innerHTML = `<div class="banner arr">📍 Tu es chez ${esc(a.nom)}.</div>`;
    else if(prevu && prevu.line_id !== a.line_id) ban.innerHTML = `<div class="banner">Hors de l'ordre prévu : l'arrêt prévu était n° ${prevu.ordre} (${esc(prevu.nom)}). <button class="linkbtn" id="b-back">Revenir à l'ordre</button></div>`;
    const d = pos ? km(pos, a) : null;
    $("t-current").innerHTML = `
      <div class="card cur">
        <div class="small muted">${a.line_id===(prevu&&prevu.line_id)?"Prochaine livraison":"Livraison affichée"}${d!==null?` · à ${distTxt(d)}`:""}</div>
        <h2><span class="stop-num">${a.ordre}</span>${esc(a.nom)}</h2>
        <div class="muted">${esc(a.ville)}${a.adresse?" · "+esc(a.adresse):""}</div>
        <div class="big num">${a.kg} kg${a.taille?` <span class="tag t">${esc(a.taille)}</span>`:""}</div>
        ${a.horaire?`<span class="tag h">⏰ ${esc(a.horaire)}</span>`:""}<span class="small muted">prévu vers ${esc(a.heure||"–")}</span>
        ${a.commentaire?`<div class="comment">💬 ${esc(a.commentaire)}</div>`:""}
        <div style="height:12px"></div>
        <a class="btn waze" href="${wazeUrl(a)}" target="_blank" rel="noopener">🚗 Y aller avec Waze</a>
        <div style="height:10px"></div>
        <button class="btn ok" id="b-livre">✅ Livré</button>
        ${a.telephone?`<div style="height:10px"></div><a class="btn light" href="tel:${esc(a.telephone)}">📞 Appeler ${esc(a.telephone)}</a>`:""}
      </div>`;
    $("b-livre").onclick = ()=> valider(a);
    const back = $("b-back"); if(back) back.onclick = ()=>{ horsOrdre=false; courant=null; rendre(); };
  }

  $("t-rest-title").textContent = `Reste à livrer (${r.length})`;
  $("t-rest").innerHTML = r.map(x=>{
    const d = pos ? " · "+distTxt(km(pos,x)) : "";
    return `<li><span class="stop-num">${x.ordre}</span><div class="info"><div style="font-weight:700;">${esc(x.nom)}</div><div class="small muted">${esc(x.ville)} · ${x.kg} kg${x.taille?" · "+esc(x.taille):""}${x.horaire?" · ⏰ "+esc(x.horaire):""}${d}</div></div>${x.line_id===(a&&a.line_id)?`<span class="small muted">affiché</span>`:`<button class="linkbtn" data-pick="${esc(x.line_id)}">Afficher</button>`}</li>`;
  }).join("") || `<li class="muted">Rien.</li>`;
  $("t-rest").querySelectorAll("[data-pick]").forEach(b=> b.onclick = ()=> choisir(b.dataset.pick));

  const done = tous.filter(x=>faits.has(x.line_id));
  $("t-done-title").textContent = `Déjà livrés (${done.length})`;
  $("t-done").innerHTML = done.map(x=>`<li class="done"><span class="stop-num" style="background:var(--ok);">✓</span><div class="info"><div style="font-weight:700;">${esc(x.nom)}</div><div class="small muted">${esc(x.ville)} · ${x.kg} kg · ${heure(faits.get(x.line_id))}</div></div><button class="linkbtn" data-undo="${esc(x.line_id)}">Annuler</button></li>`).join("") || `<li class="muted">Aucun pour l'instant.</li>`;
  $("t-done").querySelectorAll("[data-undo]").forEach(b=> b.onclick = ()=> annuler(b.dataset.undo));
}
function heure(iso){ try{ return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }catch(_){ return ""; } }

/* ---------- Validation (avec file d'attente hors réseau) ---------- */
function valider(a){
  const prevu = prochainDansOrdre();
  const etaitHorsOrdre = prevu && prevu.line_id !== a.line_id;
  faits.set(a.line_id, new Date().toISOString());
  file.push({ action:"livre", tournee_id: tid, line_id: a.line_id, lat: pos&&pos.lat, lng: pos&&pos.lng, t: new Date().toISOString() });
  store.set("af_file", file);
  // Après un arrêt hors ordre, on passe au client restant le plus proche ;
  // sinon on suit l'ordre de la tournée.
  horsOrdre = !!etaitHorsOrdre;
  courant = null; store.set("af_courant", null);
  arriveeVue = null;
  vibre();
  toast(`✅ ${a.nom} livré`);
  rendre();
  window.scrollTo({top:0, behavior:"smooth"});
  viderFile();
}
function annuler(lineId){
  faits.delete(lineId);
  file.push({ action:"annuler", tournee_id: tid, line_id: lineId, t: new Date().toISOString() });
  store.set("af_file", file);
  rendre(); viderFile();
}
let envoiEnCours = false;
async function viderFile(){
  if(envoiEnCours || !auth) return;
  envoiEnCours = true;
  try{
    while(file.length){
      const a = file[0];
      try{ await api({ ...a, camion: auth.camion, code: auth.code }); }
      catch(e){ if(e.status && e.status < 500 && e.status !== 429){ /* refus définitif : on l'abandonne */ } else break; }
      file.shift(); store.set("af_file", file);
    }
  } finally { envoiEnCours = false; }
}
setInterval(viderFile, 20000);
window.addEventListener("online", viderFile);

/* ---------- GPS ---------- */
let watchId = null;
function demarrerGPS(){
  if(watchId !== null || !("geolocation" in navigator)){ if(!("geolocation" in navigator)) setGps(false,"pas de GPS"); return; }
  watchId = navigator.geolocation.watchPosition(onPos, err=>{
    setGps(false, err.code===1 ? "GPS refusé" : "GPS indisponible");
  }, { enableHighAccuracy:true, maximumAge:10000, timeout:30000 });
}
function setGps(ok, txt){ $("gps-dot").className = "dot " + (ok?"on":"off"); $("gps-txt").textContent = txt; }
function onPos(p){
  pos = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now() };
  setGps(true, "GPS ±" + Math.round(p.coords.accuracy) + " m");
  if(tid && Date.now() - lastSent > ENVOI_POS_MS && auth){
    lastSent = Date.now();
    api({ action:"position", camion:auth.camion, code:auth.code, tournee_id:tid, lat:pos.lat, lng:pos.lng, precision:pos.acc }).catch(()=>{});
  }
  // Chez quel client est le camion ?
  const r = restants();
  const proches = r.map(a=>({a, d:km(pos,a)*1000})).filter(x=>x.d<=RAYON_ARRIVEE_M).sort((x,y)=>x.d-y.d);
  const cur = arretCourant();
  if(proches.length){
    const ici = proches[0].a;
    if(arriveeVue !== ici.line_id){
      arriveeVue = ici.line_id;
      if(!cur || ici.line_id !== cur.line_id){
        const prevu = prochainDansOrdre();
        choisir(ici.line_id, prevu && prevu.line_id!==ici.line_id ? `Tu es chez ${ici.nom} (n° ${ici.ordre}) : sa commande est affichée.` : null);
      } else { rendre(); }
      vibre();
      return;
    }
  } else if(arriveeVue){ arriveeVue = null; }
  // rafraîchit les distances sans redessiner trop souvent
  if(!onPos.t || Date.now()-onPos.t > 15000){ onPos.t = Date.now(); rendre(); }
}

/* ---------- Écran toujours allumé ---------- */
let wakeLock = null;
async function garderEcran(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock=null; }); } }catch(_){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && auth && data){ garderEcran(); charger(false).catch(()=>{}); viderFile(); }
});
setInterval(()=>{ if(auth && data && document.visibilityState==="visible") charger(false).catch(()=>{}); }, 120000);

/* ---------- Démarrage ---------- */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
if(auth){
  charger(false).catch(e=>{
    if(e.status===401){ store.del("af_auth"); auth=null; showLogin("Code incorrect, reconnecte-toi."); }
    else { showLogin("Pas de réseau pour l'instant. Réessaie dans un instant."); }
  });
} else showLogin();
})();
</script>
